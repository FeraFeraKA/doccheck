name: Independent AI review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: 'Номер открытого PR для проверки'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      number: ${{ steps.pr.outputs.number }}
      base: ${{ steps.pr.outputs.base }}
      head: ${{ steps.pr.outputs.head }}
      context: ${{ steps.pr.outputs.context }}
    steps:
      - name: Get PR and identify Linear issue
        id: pr
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PR_INPUT: ${{ inputs.pull_request_number }}
        with:
          script: |
            const raw = context.eventName === 'workflow_dispatch' ? process.env.PR_INPUT : String(context.payload.pull_request.number);
            if (!/^[1-9]\d*$/.test(raw)) throw new Error('Нужен номер PR.');
            const number = Number(raw);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== 'open') throw new Error('PR должен быть открыт.');
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) throw new Error('Ревью внешних fork не настроено.');
            if (context.eventName === 'pull_request' && pr.head.sha !== context.payload.pull_request.head.sha) throw new Error('Head изменился: дождитесь нового запуска.');
            const body = (pr.body || '').replace(/<!--[\s\S]*?-->/g, '');
            const ids = [...new Set(`${pr.title}\n${body}`.match(/\bNRT-\d+\b/gi)?.map(id => id.toUpperCase()) || [])];
            if (ids.length !== 1) throw new Error('Укажите ровно один уникальный ID задачи NRT в заголовке или описании PR.');
            const payload = { number, issue_id: ids[0], base_sha: pr.base.sha, head_sha: pr.head.sha };
            core.setOutput('number', String(number));
            core.setOutput('base', pr.base.sha);
            core.setOutput('head', pr.head.sha);
            core.setOutput('context', Buffer.from(JSON.stringify(payload), 'utf8').toString('base64'));

  review:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      result: ${{ steps.codex.outputs.final-message }}
    steps:
      - name: Checkout trusted base instructions
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.base }}
          path: trusted
          persist-credentials: false
      - name: Checkout PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.head }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Check review commits
        env:
          EXPECTED_HEAD: ${{ needs.prepare.outputs.head }}
          EXPECTED_BASE: ${{ needs.prepare.outputs.base }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_HEAD"
          git -C source cat-file -e "$EXPECTED_BASE^{commit}"
      - name: Retrieve the Linear issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          REVIEW_CONTEXT: ${{ needs.prepare.outputs.context }}
          LINEAR_KEY: ${{ secrets.LINEAR_API_KEY }}
        with:
          script: |
            const fs = require('node:fs');
            if (!process.env.LINEAR_KEY) throw new Error('Добавьте LINEAR_API_KEY с доступом только на чтение.');
            const ctx = JSON.parse(Buffer.from(process.env.REVIEW_CONTEXT, 'base64').toString('utf8'));
            const query = 'query ReviewIssue($id: String!) { issue(id: $id) { identifier title description url updatedAt team { key } project { id } } }';
            const response = await fetch('https://api.linear.app/graphql', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json', Authorization: process.env.LINEAR_KEY },
              body: JSON.stringify({ query, variables: { id: ctx.issue_id } }),
              signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) throw new Error(`Linear API недоступен: HTTP ${response.status}.`);
            const result = await response.json();
            if (result.errors?.length) throw new Error('Linear вернул ошибку GraphQL; задача не получена.');
            const issue = result.data?.issue;
            if (!issue || issue.identifier !== ctx.issue_id || issue.team?.key !== 'NRT' || issue.project?.id !== '632e4b89-471e-4ae5-bf7a-3b3636428d6d' || !issue.description?.trim()) {
              throw new Error('Задача не найдена, пуста или не относится к проекту DocCheck.');
            }
            if (issue.description.length > 50000) throw new Error('Описание задачи слишком длинное для автоматического ревью.');
            ctx.linear_issue = { identifier: issue.identifier, title: issue.title, description: issue.description, url: issue.url, updated_at: issue.updatedAt };
            fs.writeFileSync('source/.codex-review-context.json', JSON.stringify(ctx), { mode: 0o600 });
      - name: Require API key
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_KEY" ]; then
            echo 'Добавьте OPENAI_API_KEY в GitHub Actions secrets.' >&2
            exit 1
          fi
      - name: Review with Codex
        id: codex
        uses: openai/codex-action@1d82a3dba7c7988ec71ecae1ed5b8e8db96495c5 # v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          codex-version: '0.167.2'
          working-directory: ${{ github.workspace }}/source
          prompt-file: ${{ github.workspace }}/trusted/.github/codex/review-prompt.md
          output-schema-file: ${{ github.workspace }}/trusted/.github/codex/review-schema.json
          permission-profile: ':read-only'
          safety-strategy: drop-sudo
          codex-args: '["--ephemeral"]'

  publish:
    if: ${{ always() }}
    needs: [prepare, review]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Publish review and set check result
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          REVIEW_RESULT: ${{ needs.review.result }}
          PR_NUMBER: ${{ needs.prepare.outputs.number }}
          EXPECTED_HEAD: ${{ needs.prepare.outputs.head }}
          EXPECTED_BASE: ${{ needs.prepare.outputs.base }}
          REVIEW_JSON: ${{ needs.review.outputs.result }}
        with:
          script: |
            if (process.env.PREPARE_RESULT !== 'success') throw new Error('Не удалось подготовить ревью; см. задание prepare.');
            const number = Number(process.env.PR_NUMBER);
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            if (pr.state !== 'open' || pr.head.sha !== process.env.EXPECTED_HEAD || pr.base.sha !== process.env.EXPECTED_BASE) {
              throw new Error('PR или его base/head изменились: результат устарел.');
            }
            let result;
            try {
              if (process.env.REVIEW_RESULT !== 'success') throw new Error('Запуск ревьюера завершился с ошибкой.');
              result = JSON.parse(process.env.REVIEW_JSON || '');
              if (!['pass', 'changes_requested', 'blocked'].includes(result.verdict) || typeof result.summary !== 'string' || !Array.isArray(result.findings) || !Array.isArray(result.limitations)) throw new Error('Некорректный результат.');
              if (result.verdict === 'pass' && result.findings.length !== 0) throw new Error('Успешный вердикт содержит замечания.');
              if (result.verdict === 'changes_requested' && result.findings.length === 0) throw new Error('Вердикт не содержит замечаний.');
              for (const f of result.findings) {
                if (!['P0','P1','P2','P3'].includes(f.priority) || typeof f.file !== 'string' || !f.file || !Number.isInteger(f.line) || f.line < 1 || typeof f.description !== 'string') throw new Error('Некорректная находка.');
              }
              if (!result.limitations.every(x => typeof x === 'string')) throw new Error('Некорректные ограничения.');
            } catch (error) {
              result = { verdict: 'blocked', summary: 'Ревью не завершено или его результат некорректен. См. журнал workflow.', findings: [], limitations: ['Автоматическая проверка не пройдена.'] };
            }
            const findings = result.findings.map(f => `- **${f.priority}** \`${f.file.replace(/`/g, '')}:${f.line}\` — ${f.description}`).join('\n') || 'Нет.';
            const limitations = result.limitations.map(x => `- ${x}`).join('\n') || 'Не указаны.';
            const body = `## Независимое AI-ревью\n\nВердикт: **${result.verdict}**\n\nBase: \`${process.env.EXPECTED_BASE}\`\nHead: \`${process.env.EXPECTED_HEAD}\`\n\n${result.summary}\n\n### Замечания\n${findings}\n\n### Ограничения\n${limitations}\n\nТекст задачи взят из Linear на момент запуска; реальная обработка отдельно не подтверждается. [Запуск workflow](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`;
            await github.rest.issues.createComment({ ...context.repo, issue_number: number, body });
            if (result.verdict !== 'pass') core.setFailed(`Ревью: ${result.verdict}`);
