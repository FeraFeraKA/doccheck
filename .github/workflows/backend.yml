name: Backend checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scaffold:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: doccheck_test
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: doccheck_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U doccheck_test -d doccheck_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DOCCHECK_TEST_DATABASE_URL: postgresql+psycopg://doccheck_test:synthetic-ci-password@127.0.0.1:5432/doccheck_test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: backend/.python-version
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.9.17'
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Check formatting and lint
        run: |
          uv run --frozen ruff check src migrations tests
          uv run --frozen ruff format --check src migrations tests
      - name: Test PostgreSQL, real HTTP and separate worker
        run: uv run --frozen pytest tests --ignore=tests/ml_module -v
