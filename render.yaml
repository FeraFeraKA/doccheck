previews:
  generation: 'off'

services:
  - type: web
    name: doccheck-synthetic-demo-api
    runtime: docker
    plan: free
    region: frankfurt
    autoDeployTrigger: 'off'
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m doccheck_backend.render_demo
    healthCheckPath: /health
    envVars:
      - key: DOCCHECK_PUBLIC_DEMO
        value: '1'
      - key: DOCCHECK_RENDER_DATABASE_URL
        fromDatabase:
          name: doccheck-synthetic-demo-db
          property: connectionString

databases:
  - name: doccheck-synthetic-demo-db
    region: frankfurt
    plan: free
    postgresMajorVersion: '18'
    ipAllowList: []
