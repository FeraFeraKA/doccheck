[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "doccheck-ml"
version = "0.1.0"
description = "Local document identity rules and optional Qwen number reader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
mlx = ["mlx==0.32.4", "mlx-vlm==0.7.12", "transformers==5.22.2", "pillow==13.0.0"]

[project.scripts]
doccheck-ml = "doccheck_ml.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
