server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Resolve the API service on each cache interval so a recreated API can change IP.
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 2s;
    set $api_upstream http://api:8000;
    proxy_connect_timeout 2s;
    proxy_read_timeout 4s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /health {
        proxy_pass $api_upstream;
    }

    location ~ ^/api/v0/runs(/uploads)?$ {
        client_max_body_size 252m;
        proxy_read_timeout 120s;
        error_page 413 = @run_upload_too_large;
        proxy_pass $api_upstream;
    }

    location @run_upload_too_large {
        default_type application/json;
        return 413 '{"code":"upload_too_large","message":"Upload too large"}';
    }

    location /api/ {
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
