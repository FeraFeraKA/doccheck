<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F4F7F6" />
    <meta name="description" content="DocCheck — сверка затрат с первичными документами" />
    <title>DocCheck — сверка затрат</title>
    <script>
      try {
        const saved = localStorage.getItem('doccheck-theme');
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch { document.documentElement.dataset.theme = 'light'; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
