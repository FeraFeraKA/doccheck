x-backend: &backend
  image: doccheck-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  environment:
    DATABASE_URL: "postgresql+psycopg://doccheck:${DOCCHECK_DB_PASSWORD:?Set DOCCHECK_DB_PASSWORD in .env}@db:5432/doccheck"

services:
  db:
    image: postgres:18.4@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    environment:
      POSTGRES_USER: doccheck
      POSTGRES_DB: doccheck
      POSTGRES_PASSWORD: "${DOCCHECK_DB_PASSWORD:?Set DOCCHECK_DB_PASSWORD in .env}"
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "doccheck", "-d", "doccheck"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    volumes:
      - postgres-data:/var/lib/postgresql
    networks: [backend]

  migrate:
    <<: *backend
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]

  api:
    <<: *backend
    environment:
      DATABASE_URL: "postgresql+psycopg://doccheck:${DOCCHECK_DB_PASSWORD:?Set DOCCHECK_DB_PASSWORD in .env}@db:5432/doccheck"
      DOCCHECK_UPLOAD_ROOT: /var/lib/doccheck/runs
    volumes:
      - run-files:/var/lib/doccheck/runs
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).close()"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [frontend, backend]

  worker:
    <<: *backend
    environment:
      DATABASE_URL: "postgresql+psycopg://doccheck:${DOCCHECK_DB_PASSWORD:?Set DOCCHECK_DB_PASSWORD in .env}@db:5432/doccheck"
      DOCCHECK_UPLOAD_ROOT: /var/lib/doccheck/runs
      WORKER_POLL_SECONDS: "${WORKER_POLL_SECONDS:-0.5}"
      SYNTHETIC_DELAY_SECONDS: "${SYNTHETIC_DELAY_SECONDS:-2}"
    volumes:
      - run-files:/var/lib/doccheck/runs:ro
    command: ["python", "-m", "doccheck_backend.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks: [backend]

  document-worker:
    restart: on-failure
    profiles: [document-worker]
    image: "${DOCCHECK_DOCUMENT_WORKER_IMAGE:-doccheck-backend:local}"
    environment:
      DATABASE_URL: "postgresql+psycopg://doccheck:${DOCCHECK_DB_PASSWORD:?Set DOCCHECK_DB_PASSWORD in .env}@db:5432/doccheck"
      DOCCHECK_UPLOAD_ROOT: /var/lib/doccheck/runs
      WORKER_POLL_SECONDS: "${WORKER_POLL_SECONDS:-0.5}"
    volumes:
      - run-files:/var/lib/doccheck/runs:ro
    command: ["python", "-m", "doccheck_backend.run_worker", "--processor", "${DOCCHECK_DOCUMENT_PROCESSOR:-}"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
    networks: [backend]

  frontend:
    image: doccheck-frontend:local
    build:
      context: .
      dockerfile: frontend/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DOCCHECK_PORT:-8080}:80"
    networks: [frontend]

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres-data:
  run-files:
