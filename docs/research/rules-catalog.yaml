version: "1.0"
checked_on: "2026-11-13"
scope: "Публичные правила и проверки согласованности для исследования NRT-60"
status: research
evaluation: "arithmetic_without_ai=false означает, что до арифметики нужно подтвердить связь или применимость правила. Это поле не предписывает использование ИИ."
money:
  representation: "Decimal из строки, RUB"
  comparison: "Только при известных ролях, единицах, периоде и полном наборе требуемых доказательств"
  exact_rub: "0.00"
  tolerance_note: "Нулевой допуск в арифметической проверке является правилом сравнения DocCheck. Неизвестное округление или неполнота дают unverified."
  rounding_note: "Порядок округления задаётся нормой либо документированной политикой. Денежное поле в копейках не доказывает уровень округления."

