previews:
  generation: 'off'

services:
  - type: web
    name: doccheck-hosted-preview-api
    runtime: docker
    plan: 0.5c-512mb
    region: frankfurt
    autoDeployTrigger: 'off'
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    dockerCommand: python -m doccheck_backend.render_hosted
    healthCheckPath: /health
    disk:
      name: synthetic-preview-originals
      mountPath: /var/lib/doccheck
      sizeGB: 1
    envVars:
      - key: DOCCHECK_PUBLIC_DEMO
        value: '1'
      - key: DOCCHECK_UPLOAD_ROOT
        value: /var/lib/doccheck/runs
      - key: DOCCHECK_HOSTED_WORKER_SHA256
        sync: false
      - key: DOCCHECK_HOSTED_VIEWERS
        sync: false
      - key: DOCCHECK_HOSTED_SESSION_KEY
        sync: false
      - key: DOCCHECK_RENDER_DATABASE_URL
        fromDatabase:
          name: doccheck-hosted-preview-db
          property: connectionString

databases:
  - name: doccheck-hosted-preview-db
    region: frankfurt
    plan: free
    postgresMajorVersion: '18'
    ipAllowList: []
